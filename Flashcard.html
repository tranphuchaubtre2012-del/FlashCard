<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tạo học phần</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff;
    color: #182033;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   HEADER
========================= */

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px 0;
}

.top h1 {
    font-size: 23px;
    margin: 0;
    font-weight: 700;
}

.top-buttons {
    display: flex;
    gap: 10px;
}

button {
    border: 0;
    cursor: pointer;
    font-family: inherit;
}

.btn-create {
    background: #eef0ff;
    color: #4255ff;
    padding: 11px 18px;
    border-radius: 22px;
    font-weight: 600;
}

.btn-study {
    background: #4255ff;
    color: white;
    padding: 11px 20px;
    border-radius: 22px;
    font-weight: 600;
}

/* =========================
   MAIN
========================= */

.container {
    padding: 14px;
    max-width: 1200px;
    margin: auto;
}

.visibility {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    background: #f5f6fa;
    color: #596681;

    padding: 8px 13px;
    border-radius: 20px;

    font-size: 13px;
    font-weight: 600;
}

.info {
    margin-top: 28px;
}

.title-input,
.description {
    width: 100%;
    border: none;
    outline: none;

    background: #f5f6fa;
    border-radius: 8px;

    padding: 17px;
    color: #17213a;
}

.title-input {
    font-size: 15px;
    font-weight: 600;
}

.description {
    margin-top: 8px;
    height: 52px;
    resize: none;
    font-size: 14px;
}

.title-input::placeholder,
.description::placeholder {
    color: #8792ad;
    font-weight: 600;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 29px;
    margin-bottom: 20px;
}

.left-tools,
.right-tools {
    display: flex;
    align-items: center;
    gap: 12px;
}

.tool {
    height: 38px;
    padding: 0 16px;

    border-radius: 20px;
    background: #f5f6fa;

    color: #64708a;
    font-weight: 600;
}

.tool:hover {
    background: #e9ebf2;
}

.tool-small {
    width: 38px;
    height: 38px;
    border-radius: 50%;

    background: #f5f6fa;
    color: #68738d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
}

.delete-all {
    background: #c90024;
    color: white;
}

.lock {
    color: #ffbd00;
    margin-left: 5px;
}

/* =========================
   SUGGESTION TOGGLE
========================= */

.suggest {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 13px;
    color: #39435c;
    font-weight: 600;
}

.switch {
    width: 32px;
    height: 19px;

    border-radius: 20px;
    background: #dfe3ef;

    position: relative;
    cursor: pointer;
}

.switch::after {
    content: "";

    position: absolute;

    width: 17px;
    height: 17px;

    top: 1px;
    left: 1px;

    background: white;
    border-radius: 50%;

    transition: .2s;
}

.switch.active {
    background: #4255ff;
}

.switch.active::after {
    left: 14px;
}

/* =========================
   CARD
========================= */

.cards {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.card {
    background: white;

    border-radius: 17px;

    box-shadow:
        0 5px 25px rgba(20, 30, 60, .08);

    padding: 17px 23px 25px;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.card-number {
    font-size: 15px;
    color: #5a6785;
    font-weight: 700;
}

.card-actions {
    display: flex;
    gap: 22px;
}

.card-actions button {
    background: transparent;
    color: #59647d;
    font-size: 20px;
}

.card-actions .remove {
    color: #d9dce5;
    font-size: 14px;
}

.card-body {
    display: grid;
    grid-template-columns: 1fr 1fr 76px;
    gap: 20px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field input {
    height: 43px;

    border: none;
    outline: none;

    background: #f5f6fa;
    border-radius: 7px;

    padding: 0 14px;

    font-size: 14px;
    color: #26304a;
}

.field input:focus {
    box-shadow: 0 0 0 2px #d8dcff;
}

.field label {
    margin-top: 11px;

    color: #8994ae;
    font-size: 11px;
    font-weight: 700;
}

/* =========================
   IMAGE
========================= */

.image-button {
    height: 54px;

    border: 1px dashed #cbd1df;
    background: white;

    border-radius: 6px;

    color: #4d5871;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    gap: 4px;
}

.image-button span {
    font-size: 19px;
}

/* =========================
   ADD CARD
========================= */

.add-card-area {
    display: flex;
    justify-content: center;

    margin: 42px 0 70px;
}

.add-card {
    background: #f5f6fa;
    color: #65708a;

    padding: 15px 28px;

    border-radius: 28px;

    font-size: 14px;
    font-weight: 700;
}

.add-card:hover {
    background: #e9ebf2;
}

/* =========================
   BOTTOM
========================= */

.bottom {
    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    height: 76px;

    background: white;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 12px;

    padding: 0 15px;

    box-shadow: 0 -5px 20px rgba(0,0,0,.04);
}

.bottom button {
    padding: 15px 29px;
    border-radius: 30px;

    font-weight: 700;
    font-size: 14px;
}

.bottom-create {
    background: #eef0ff;
    color: #4255ff;
}

.bottom-study {
    background: #4255ff;
    color: white;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .top {
        align-items: flex-start;
    }

    .top h1 {
        font-size: 18px;
    }

    .top-buttons {
        display: none;
    }

    .toolbar {
        flex-wrap: wrap;
        gap: 15px;
    }

    .card-body {
        grid-template-columns: 1fr;
    }

    .image-button {
        width: 100%;
    }

    .bottom {
        height: 68px;
    }

    .bottom button {
        padding: 12px 18px;
    }
}
</style>
</head>


<body>

<!-- =========================
     TOP
========================= -->

<div class="top">

    <h1>Tạo một học phần mới</h1>

    <div class="top-buttons">
        <button class="btn-create" onclick="createSet()">
            Tạo
        </button>

        <button class="btn-study" onclick="createAndStudy()">
            Tạo và ôn luyện
        </button>
    </div>

</div>


<div class="container">

    <!-- VISIBILITY -->

    <div class="visibility">
        ◉ &nbsp; Công khai
    </div>


    <!-- TITLE -->

    <div class="info">

        <input
            class="title-input"
            id="setTitle"
            placeholder="Tiêu đề"
        >

        <textarea
            class="description"
            id="setDescription"
            placeholder="Thêm mô tả..."
        ></textarea>

    </div>


    <!-- TOOLBAR -->

    <div class="toolbar">

        <div class="left-tools">

            <button class="tool" onclick="addCard()">
                ＋ &nbsp; Nhập
            </button>

            <button class="tool">
                ＋ &nbsp; Thêm sơ đồ
                <span class="lock">🔒</span>
            </button>

        </div>


        <div class="right-tools">

            <div class="suggest">
                Gợi ý

                <div
                    class="switch active"
                    id="suggestSwitch"
                    onclick="toggleSuggestion()"
                ></div>
            </div>

            <button class="tool-small">
                ⌕
            </button>

            <button class="tool-small">
                ↔
            </button>

            <button class="tool-small">
                ▦
            </button>

            <button
                class="tool-small delete-all"
                onclick="deleteAll()"
            >
                🗑
            </button>

        </div>

    </div>


    <!-- CARDS -->

    <div class="cards" id="cards"></div>


    <!-- ADD CARD -->

    <div class="add-card-area">

        <button
            class="add-card"
            onclick="addCard()"
        >
            Thêm thẻ
        </button>

    </div>

</div>


<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">

    <button
        class="bottom-create"
        onclick="createSet()"
    >
        Tạo
    </button>

    <button
        class="bottom-study"
        onclick="createAndStudy()"
    >
        Tạo và ôn luyện
    </button>

</div>


<script>

/* =========================
   DATA
========================= */

let cards = [
    {
        term: "",
        definition: ""
    },
    {
        term: "",
        definition: ""
    }
];


/* =========================
   RENDER
========================= */

function renderCards() {

    const container =
        document.getElementById("cards");

    container.innerHTML = "";

    cards.forEach((card, index) => {

        const cardHTML = document.createElement("div");

        cardHTML.className = "card";

        cardHTML.innerHTML = `

            <div class="card-header">

                <div class="card-number">
                    ${index + 1}
                </div>

                <div class="card-actions">

                    <button
                        onclick="moveCard(${index})"
                        title="Đổi vị trí"
                    >
                        =
                    </button>

                    <button
                        class="remove"
                        onclick="removeCard(${index})"
                        title="Xóa thẻ"
                    >
                        ♧
                    </button>

                </div>

            </div>


            <div class="card-body">

                <div class="field">

                    <input
                        type="text"
                        placeholder=""
                        value="${escapeHTML(card.term)}"
                        oninput="updateTerm(${index}, this.value)"
                    >

                    <label>
                        THUẬT NGỮ
                    </label>

                </div>


                <div class="field">

                    <input
                        type="text"
                        placeholder=""
                        value="${escapeHTML(card.definition)}"
                        oninput="updateDefinition(${index}, this.value)"
                    >

                    <label>
                        ĐỊNH NGHĨA
                    </label>

                </div>


                <button
                    class="image-button"
                    onclick="chooseImage(${index})"
                >

                    <span>▧</span>

                    Hình ảnh

                </button>

            </div>

        `;

        container.appendChild(cardHTML);

    });

}


/* =========================
   ADD
========================= */

function addCard() {

    cards.push({
        term: "",
        definition: ""
    });

    renderCards();

    save();

}


/* =========================
   REMOVE
========================= */

function removeCard(index) {

    if (cards.length <= 1) {

        alert("Phải có ít nhất một thẻ.");

        return;
    }

    cards.splice(index, 1);

    renderCards();

    save();

}


/* =========================
   DELETE ALL
========================= */

function deleteAll() {

    if (
        !confirm(
            "Bạn có chắc muốn xóa toàn bộ thẻ?"
        )
    ) return;

    cards = [
        {
            term: "",
            definition: ""
        }
    ];

    renderCards();

    save();

}


/* =========================
   UPDATE
========================= */

function updateTerm(index, value) {

    cards[index].term = value;

    save();

}


function updateDefinition(index, value) {

    cards[index].definition = value;

    save();

}


/* =========================
   MOVE
========================= */

function moveCard(index) {

    if (cards.length < 2) return;

    let next = index + 1;

    if (next >= cards.length) {
        next = 0;
    }

    [
        cards[index],
        cards[next]
    ] = [
        cards[next],
        cards[index]
    ];

    renderCards();

    save();

}


/* =========================
   SUGGESTION
========================= */

function toggleSuggestion() {

    const sw =
        document.getElementById("suggestSwitch");

    sw.classList.toggle("active");

}


/* =========================
   IMAGE
========================= */

function chooseImage(index) {

    alert(
        "Chức năng chọn hình ảnh có thể được thêm vào đây."
    );

}


/* =========================
   CREATE
========================= */

function createSet() {

    const title =
        document.getElementById("setTitle").value.trim();

    if (!title) {

        alert("Hãy nhập tiêu đề học phần.");

        document
            .getElementById("setTitle")
            .focus();

        return;
    }

    const validCards =
        cards.filter(
            c => c.term.trim() || c.definition.trim()
        );

    if (validCards.length === 0) {

        alert("Hãy nhập ít nhất một thẻ.");

        return;
    }

    save();

    alert(
        `Đã tạo học phần "${title}" với ${validCards.length} thẻ!`
    );

}


/* =========================
   CREATE + STUDY
========================= */

function createAndStudy() {

    const title =
        document.getElementById("setTitle").value.trim();

    if (!title) {
        alert("Hãy nhập tiêu đề học phần.");
        return;
    }

    const validCards = cards.filter(
        c => c.term.trim() && c.definition.trim()
    );

    if (validCards.length === 0) {
        alert("Hãy nhập ít nhất một thẻ đầy đủ.");
        return;
    }

    save();

    // Lưu bộ thẻ để trang ôn luyện sử dụng
    localStorage.setItem(
        "studyCards",
        JSON.stringify({
            title: title,
            cards: validCards
        })
    );

    // Chuyển sang trang ôn luyện
    window.location.href = "study.html";
}


/* =========================
   LOCAL STORAGE
========================= */

function save() {

    const data = {

        title:
            document.getElementById("setTitle").value,

        description:
            document.getElementById("setDescription").value,

        cards: cards

    };

    localStorage.setItem(
        "myFlashcardSet",
        JSON.stringify(data)
    );

}


/* =========================
   LOAD
========================= */

function load() {

    const saved =
        localStorage.getItem("myFlashcardSet");

    if (!saved) {

        renderCards();

        return;
    }

    try {

        const data =
            JSON.parse(saved);

        document.getElementById("setTitle").value =
            data.title || "";

        document.getElementById("setDescription").value =
            data.description || "";

        if (
            Array.isArray(data.cards) &&
            data.cards.length
        ) {

            cards = data.cards;

        }

    } catch (error) {

        console.log(error);

    }

    renderCards();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   SAVE TITLE
========================= */

document
    .getElementById("setTitle")
    .addEventListener(
        "input",
        save
    );

document
    .getElementById("setDescription")
    .addEventListener(
        "input",
        save
    );


/* =========================
   START
========================= */

load();

</script>

</body>
</html>
