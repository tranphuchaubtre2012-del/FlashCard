<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ôn luyện</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f6f7fb;
    color: #182033;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
}


/* =========================
   HEADER
========================= */

.header {
    height: 66px;

    background: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    border-bottom: 1px solid #e8eaf0;
}

.header h2 {
    margin: 0;
    font-size: 20px;
}

.back {
    border: none;

    background: #f0f2f8;
    color: #53617c;

    padding: 10px 18px;

    border-radius: 22px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   CONTAINER
========================= */

.container {
    max-width: 850px;

    margin: 38px auto;

    padding: 15px;
}


/* =========================
   PROGRESS
========================= */

.progress {
    text-align: center;

    color: #68738c;

    font-size: 14px;

    margin-bottom: 15px;
}


/* =========================
   CARD AREA
========================= */

.card-area {
    position: relative;

    width: 100%;
    height: 430px;

    perspective: 1200px;
}


/* =========================
   FLASHCARD
========================= */

.card {
    width: 100%;
    height: 100%;

    position: absolute;

    cursor: grab;

    transform-origin: center bottom;

    transition:
        transform .25s ease,
        opacity .25s ease;

    touch-action: none;
}

.card.dragging {
    transition: none;
    cursor: grabbing;
}


.card-inner {
    width: 100%;
    height: 100%;

    position: relative;

    transform-style: preserve-3d;

    transition: transform .5s ease;
}


.card.flipped .card-inner {
    transform: rotateY(180deg);
}


.side {
    position: absolute;

    width: 100%;
    height: 100%;

    background: white;

    border-radius: 20px;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 50px;

    text-align: center;

    box-shadow:
        0 10px 35px rgba(20, 30, 60, .10);

    backface-visibility: hidden;

    overflow: hidden;
}


.term {
    font-size: 36px;
    font-weight: bold;
}


.definition {
    transform: rotateY(180deg);

    font-size: 28px;
}


/* =========================
   DRAG INDICATOR
========================= */

.swipe-label {
    position: absolute;

    top: 25px;

    padding: 10px 18px;

    border-radius: 10px;

    font-size: 17px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    z-index: 5;

    transition: opacity .1s;
}

.swipe-known {
    right: 25px;

    color: #159447;

    background: #e8f8ef;
}

.swipe-unknown {
    left: 25px;

    color: #d73a25;

    background: #fff0ed;
}


/* =========================
   HINT
========================= */

.hint {
    text-align: center;

    margin-top: 16px;

    color: #929bb0;

    font-size: 13px;
}

.hint b {
    color: #59647b;
}


/* =========================
   FLIP BUTTON
========================= */

.flip-button-area {
    display: flex;

    justify-content: center;

    margin-top: 23px;
}

.flip-button {
    border: none;

    background: #4255ff;

    color: white;

    padding: 13px 27px;

    border-radius: 25px;

    font-weight: bold;

    cursor: pointer;

    font-size: 15px;
}


/* =========================
   RESULT
========================= */

.result {
    display: none;

    text-align: center;

    padding-top: 15px;
}


.result h1 {
    margin: 0 0 5px;

    font-size: 28px;
}


.result-sub {
    color: #747e95;

    font-size: 14px;

    margin-bottom: 15px;
}


/* =========================
   ARC
========================= */

.result-gauge {
    position: relative;

    width: 520px;
    max-width: 100%;

    height: 320px;

    margin: 0 auto;
}


.result-gauge svg {
    width: 100%;
    height: 100%;

    overflow: visible;
}


/* đường nền */

.arc-background {
    fill: none;

    stroke: #e5e8ef;

    stroke-width: 30;

    stroke-linecap: round;
}


/* xanh */

.arc-green {
    fill: none;

    stroke: #25a95b;

    stroke-width: 30;

    stroke-linecap: butt;

    transition: stroke-dasharray 1s ease;
}


/* đỏ cam */

.arc-red {
    fill: none;

    stroke: #ef6a45;

    stroke-width: 30;

    stroke-linecap: butt;

    transition: stroke-dasharray 1s ease;
}


/* chữ kết quả */

.result-label {
    position: absolute;

    top: 3px;

    left: 50%;

    transform: translateX(-50%);

    background: #f6f7fb;

    padding: 5px 18px;

    font-size: 13px;

    font-weight: bold;

    color: #69738a;

    letter-spacing: 1px;
}


/* phần trăm */

.percent {
    position: absolute;

    left: 50%;

    top: 45%;

    transform: translate(-50%, -50%);

    font-size: 50px;

    font-weight: 700;

    color: #26304a;
}


/* số liệu */

.stats {
    display: flex;

    justify-content: center;

    gap: 50px;

    margin-top: -10px;
}

.stat {
    display: flex;

    flex-direction: column;

    gap: 6px;

    font-size: 14px;
}

.stat strong {
    font-size: 21px;
}

.known-number {
    color: #159447;
}

.unknown-number {
    color: #e35b39;
}


/* =========================
   RESULT BUTTON
========================= */

.result-buttons {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 25px;
}

.result-buttons button {
    border: none;

    padding: 13px 23px;

    border-radius: 25px;

    cursor: pointer;

    font-weight: bold;
}

.retry {
    background: #4255ff;
    color: white;
}

.back-study {
    background: #eef0f7;
    color: #59647d;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px) {

    .container {
        margin: 20px auto;
        padding: 10px;
    }

    .card-area {
        height: 330px;
    }

    .term {
        font-size: 27px;
    }

    .definition {
        font-size: 22px;
    }

    .side {
        padding: 30px;
    }

    .result-gauge {
        height: 260px;
    }

    .stats {
        gap: 30px;
    }

    .percent {
        font-size: 42px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h2 id="title">
        Ôn luyện
    </h2>

    <button
        class="back"
        onclick="goBack()"
    >
        ← Quay lại
    </button>

</div>


<div class="container">


<!-- =========================
     STUDY
========================= -->

<div id="studyArea">


    <div
        class="progress"
        id="progress"
    >
        1 / 1
    </div>


    <div class="card-area">


        <div
            class="swipe-label swipe-unknown"
            id="unknownLabel"
        >
            ✕ CHƯA BIẾT
        </div>


        <div
            class="swipe-label swipe-known"
            id="knownLabel"
        >
            ✓ ĐÃ BIẾT
        </div>


        <div
            class="card"
            id="card"
        >

            <div class="card-inner">


                <div
                    class="side term"
                    id="term"
                >
                </div>


                <div
                    class="side definition"
                    id="definition"
                >
                </div>


            </div>

        </div>

    </div>


    <div class="hint">

        Kéo thẻ sang trái/phải hoặc nhấn
        <b>N</b> / <b>Y</b>

    </div>


    <div class="flip-button-area">

        <button
            class="flip-button"
            onclick="flipCard()"
        >
            Lật thẻ
        </button>

    </div>


</div>



<!-- =========================
     RESULT
========================= -->

<div
    class="result"
    id="result"
>


    <h1>Hoàn thành!</h1>


    <div class="result-sub">
        Bạn đã hoàn thành toàn bộ học phần
    </div>


    <div class="result-gauge">


        <div class="result-label">
            KẾT QUẢ
        </div>


        <svg
            viewBox="0 0 520 320"
        >

            <!-- nền vòng cung -->

            <path
                id="arcBackground"
                class="arc-background"
                d="M 70 260 A 190 190 0 0 1 450 260"
            />


            <!-- phần xanh -->

            <path
                id="arcGreen"
                class="arc-green"
                d="M 70 260 A 190 190 0 0 1 450 260"
            />


            <!-- phần đỏ -->

            <path
                id="arcRed"
                class="arc-red"
                d="M 70 260 A 190 190 0 0 1 450 260"
            />

        </svg>


        <div
            class="percent"
            id="percent"
        >
            0%
        </div>


    </div>


    <div class="stats">


        <div class="stat">

            <strong
                class="known-number"
                id="knownResult"
            >
                0
            </strong>

            <span>
                ✓ Đã biết
            </span>

        </div>


        <div class="stat">

            <strong
                class="unknown-number"
                id="unknownResult"
            >
                0
            </strong>

            <span>
                ✕ Chưa biết
            </span>

        </div>


    </div>


    <div class="result-buttons">

        <button
            class="retry"
            onclick="restart()"
        >
            Học lại
        </button>

        <button
            class="back-study"
            onclick="goBack()"
        >
            Quay lại học phần
        </button>

    </div>


</div>


</div>



<script>


/* =========================
   LOAD DATA
========================= */

let data =
    JSON.parse(
        localStorage.getItem("studyCards")
    );


let cards =
    data ? data.cards : [];


let title =
    data ? data.title : "Ôn luyện";


let current = 0;

let known = 0;

let unknown = 0;

let flipped = false;


/* =========================
   TITLE
========================= */

document
    .getElementById("title")
    .innerText = title;


/* =========================
   SHOW CARD
========================= */

function showCard() {


    if (!cards.length) {

        document
            .getElementById("term")
            .innerText =
            "Không có dữ liệu";

        return;
    }


    if (current >= cards.length) {

        finish();

        return;
    }


    document
        .getElementById("term")
        .innerText =
        cards[current].term;


    document
        .getElementById("definition")
        .innerText =
        cards[current].definition;


    document
        .getElementById("progress")
        .innerText =
        `${current + 1} / ${cards.length}`;


    flipped = false;


    document
        .getElementById("card")
        .classList.remove("flipped");


    resetCardPosition();

}


/* =========================
   FLIP
========================= */

function flipCard() {


    if (!cards.length) return;


    flipped = !flipped;


    document
        .getElementById("card")
        .classList.toggle(
            "flipped",
            flipped
        );

}


/* =========================
   Y = KNOW
========================= */

function markKnown() {

    known++;

    current++;

    showCard();

}


/* =========================
   N = UNKNOWN
========================= */

function markUnknown() {

    unknown++;

    current++;

    showCard();

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e) {


        if (
            e.key.toLowerCase() === "y"
        ) {

            markKnown();

        }


        if (
            e.key.toLowerCase() === "n"
        ) {

            markUnknown();

        }


        if (
            e.code === "Space"
        ) {

            e.preventDefault();

            flipCard();

        }

    }
);


/* =========================
   DRAG
========================= */

const card =
    document.getElementById("card");


let dragging = false;

let startX = 0;

let currentX = 0;


card.addEventListener(
    "pointerdown",
    startDrag
);


function startDrag(e) {

    if (e.button !== undefined &&
        e.button !== 0) return;


    dragging = true;

    startX = e.clientX;

    currentX = 0;


    card.classList.add("dragging");

    card.setPointerCapture(e.pointerId);

}


card.addEventListener(
    "pointermove",
    drag
);


function drag(e) {

    if (!dragging) return;


    currentX =
        e.clientX - startX;


    let rotate =
        currentX * 0.08;


    card.style.transform =
        `translateX(${currentX}px)
         rotate(${rotate}deg)`;


    let strength =
        Math.min(
            Math.abs(currentX) / 100,
            1
        );


    if (currentX < 0) {

        document
            .getElementById("unknownLabel")
            .style.opacity =
            strength;


        document
            .getElementById("knownLabel")
            .style.opacity = 0;

    } else {

        document
            .getElementById("knownLabel")
            .style.opacity =
            strength;


        document
            .getElementById("unknownLabel")
            .style.opacity = 0;

    }

}


card.addEventListener(
    "pointerup",
    endDrag
);


card.addEventListener(
    "pointercancel",
    endDrag
);


function endDrag(e) {

    if (!dragging) return;


    dragging = false;


    card.classList.remove("dragging");


    const threshold = 120;


    if (currentX > threshold) {

        swipeOut("right");

        return;

    }


    if (currentX < -threshold) {

        swipeOut("left");

        return;

    }


    resetCardPosition();

}


/* =========================
   SWIPE OUT
========================= */

function swipeOut(direction) {


    let x =
        direction === "right"
        ? window.innerWidth
        : -window.innerWidth;


    let rotate =
        direction === "right"
        ? 30
        : -30;


    card.style.transform =
        `translateX(${x}px)
         rotate(${rotate}deg)`;


    setTimeout(
        function() {


            if (direction === "right") {

                known++;

            } else {

                unknown++;

            }


            current++;


            card.style.transition =
                "none";


            card.style.transform =
                "translateX(0) rotate(0deg)";


            setTimeout(
                function() {

                    card.style.transition =
                        "transform .25s ease, opacity .25s ease";

                    showCard();

                },
                30
            );


        },
        220
    );

}


/* =========================
   RESET POSITION
========================= */

function resetCardPosition() {


    card.style.transform =
        "translateX(0) rotate(0deg)";


    document
        .getElementById("knownLabel")
        .style.opacity = 0;


    document
        .getElementById("unknownLabel")
        .style.opacity = 0;

}


/* =========================
   FINISH
========================= */

function finish() {


    document
        .getElementById("studyArea")
        .style.display = "none";


    document
        .getElementById("result")
        .style.display = "block";


    let total =
        known + unknown;


    let percent =
        total === 0
        ? 0
        : Math.round(
            known / total * 100
        );


    document
        .getElementById("percent")
        .innerText =
        percent + "%";


    document
        .getElementById("knownResult")
        .innerText =
        known;


    document
        .getElementById("unknownResult")
        .innerText =
        unknown;


    drawGauge(
        percent
    );

}


/* =========================
   RESULT ARC
========================= */

function drawGauge(percent) {


    /*
       Tổng chiều dài vòng cung.
       Được lấy trực tiếp từ SVG.
    */

    const green =
        document.getElementById(
            "arcGreen"
        );


    const red =
        document.getElementById(
            "arcRed"
        );


    const background =
        document.getElementById(
            "arcBackground"
        );


    const length =
        background.getTotalLength();


    /*
       Khoảng hở hai đầu vòng cung.
       Nhìn giống vòng tròn bị cắt
       ở phía trên.
    */

    const gap = 0;


    /*
       Tỉ lệ xanh.
    */

    const greenLength =
        length * percent / 100;


    const redLength =
        length - greenLength;


    /*
       Xanh chạy từ trái → phải.
    */

    green.style.strokeDasharray =
        `${greenLength} ${length}`;


    green.style.strokeDashoffset =
        "0";


    /*
       Đỏ bắt đầu ngay sau phần xanh.
    */

    red.style.strokeDasharray =
        `${redLength} ${length}`;


    red.style.strokeDashoffset =
        -greenLength;


    /*
       Nếu 100% biết thì
       toàn bộ vòng cung xanh.
    */

    if (percent >= 100) {

        red.style.opacity = 0;

    } else {

        red.style.opacity = 1;

    }


    /*
       Nếu 0% biết thì
       toàn bộ vòng cung đỏ.
    */

    if (percent <= 0) {

        green.style.opacity = 0;

    } else {

        green.style.opacity = 1;

    }

}


/* =========================
   RESTART
========================= */

function restart() {


    current = 0;

    known = 0;

    unknown = 0;

    flipped = false;


    document
        .getElementById("studyArea")
        .style.display = "block";


    document
        .getElementById("result")
        .style.display = "none";


    showCard();

}


/* =========================
   BACK
========================= */

function goBack() {

    window.location.href =
        "flashcard.html";

}


/* =========================
   START
========================= */

showCard();

</script>

</body>
</html>
